<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCEMate | Create Listing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">TCEMate</h1>
        <nav class="main-nav">
      <a href="index.html">Dashboard</a>
      <a href="browse.html">Browse</a>
      <a href="forum.html">Forum</a>
      <a href="notifications.html">Alerts</a>
      <a href="create-listing.html" class="active">Post</a>
      <a href="manage-applicants.html">My Listings</a>
      <a href="my-interests.html">Interests</a>

      <a href="profile-view.html">Profile</a>
      <a href="#" id="logoutBtn" class="nav-logout">Logout</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="form-card">
      <h2>Create a New Listing</h2>
      <p class="sub">Post a project, hackathon team, or mini-project request.</p>

      <form id="listingForm" novalidate>
        <fieldset style="border: none; padding: 0; margin: 0;">
          <legend style="display: none;">Listing Details</legend>
          
          <label for="listingTitle">Project Title</label>
        <input type="text" id="listingTitle" placeholder="e.g. Smart Attendance System" required>
        <span class="error-msg" id="listingTitleError"></span>

        <label for="listingType">Project Type</label>
        <input list="projectTypes" id="listingType" placeholder="Type to search..." required>
        <datalist id="projectTypes">
          <option value="Academic Mini-Project">
          <option value="Internship Project">
          <option value="Hackathon Team">
          <option value="Research">
        </datalist>

        <label for="listingDesc">Description</label>
        <textarea id="listingDesc" rows="4" placeholder="What are you building and what help do you need?" required></textarea>
        <span class="error-msg" id="listingDescError"></span>

        <div class="two-col">
          <div>
            <label for="listingDept">Target Department</label>
            <select id="listingDept">
              <optgroup label="General">
                <option value="">Any Department</option>
              </optgroup>
              <optgroup label="Engineering">
                <option selected>Information Technology</option>
                <option>Computer Science</option>
                <option>ECE</option>
                <option>Mechanical</option>
              </optgroup>
            </select>
          </div>
          <div>
            <label for="listingYear">Target Year</label>
            <select id="listingYear">
              <option value="">Any Year</option>
              <option>1st Year</option>
              <option>2nd Year</option>
              <option selected>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>

        <label>Team Size</label>
        <div class="stepper">
          <button type="button" id="decreaseTeam">−</button>
          <span id="teamCount">2</span>
          <button type="button" id="increaseTeam">+</button>
        </div>

        <label for="listingDeadline">Application Deadline</label>
        <input type="date" id="listingDeadline" required>
        <span class="error-msg" id="listingDeadlineError"></span>

        <button type="submit" class="btn-primary">Publish Listing</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TCEMate — Thiagarajar College of Engineering, Madurai</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
