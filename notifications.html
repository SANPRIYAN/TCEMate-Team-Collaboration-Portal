<!DOCTYPE html>
<html lang="en" ng-app="tcemate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCEMate | Notifications</title>
<link rel="stylesheet" href="style.css">
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-animate.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-messages.min.js"></script>
</head>
<body ng-controller="NotificationsController as vm">
  <header class="topbar">
    <h1 class="logo">TCEMate</h1>
    <nav class="main-nav">
      <a href="index.html">Dashboard</a>
      <a href="browse.html">Browse</a>
      <a href="forum.html">Forum</a>
      <a href="notifications.html" class="active">Alerts</a>
      <a href="create-listing.html">Post</a>
      <a href="manage-applicants.html">My Listings</a>
      <a href="my-interests.html">Interests</a>
      <a href="profile-view.html">Profile</a>
      <a href="#" id="logoutBtn" class="nav-logout" ng-click="vm.logout()">Logout</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="notif-header">
      <h2>Notifications</h2>
      <button class="btn-secondary" id="markAllRead" ng-click="vm.markAllRead()">Mark all as read</button>
    </section>

    <section class="notif-list" id="notifList">
      <notification-item-card notification="notification" on-read="vm.markRead(notification)" ng-repeat="notification in vm.notifications"></notification-item-card>
      <p class="sub" ng-if="!vm.notifications.length">No notifications yet.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TCEMate — Thiagarajar College of Engineering, Madurai</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
