<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCEMate | Create Post</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">TCEMate</h1>
    <nav class="main-nav">
      <a href="index.html">Dashboard</a>
      <a href="browse.html">Browse</a>
      <a href="forum.html" class="active">Forum</a>
      <a href="notifications.html">Alerts</a>
      <a href="create-listing.html">Post</a>
      <a href="manage-applicants.html">My Listings</a>
      <a href="my-interests.html">Interests</a>
      <a href="profile-view.html">Profile</a>
      <a href="#" id="logoutBtn" class="nav-logout">Logout</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="form-card">
      <h2>Start a New Discussion</h2>
      <p class="sub">Ask questions, share resources, and find collaborators.</p>

      <form id="forumPostForm" novalidate style="margin-top: 1.5rem;">
        <label for="postTitle">Title</label>
        <input type="text" id="postTitle" placeholder="Letters, numbers and basic punctuation only" required>
        <span class="error-msg" id="postTitleError"></span>

        <label for="postBody">Details</label>
        <textarea id="postBody" rows="4" placeholder="Describe your question or opportunity" required></textarea>
        <span class="error-msg" id="postBodyError"></span>

        <button type="submit" class="btn-primary">Post to Forum</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 TCEMate — Thiagarajar College of Engineering, Madurai</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
