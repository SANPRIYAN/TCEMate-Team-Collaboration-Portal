<!DOCTYPE html>
<html lang="en" ng-app="tcemate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>TCEMate | Reset Password</title>
<link rel="stylesheet" href="style.css?v=tcemate-ux-5">
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-animate.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-messages.min.js"></script>
</head>
<body class="app-page auth-body" ng-controller="ResetPasswordController as vm">
  <header class="topbar">
    <a class="logo" href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;"><img src="assets/tce-logo.png" alt="TCE Logo" style="height: 32px; width: 32px; object-fit: contain;" /><span>TCEMate</span></a>
    <nav class="main-nav" aria-label="Public navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="login.html">Log in</a></nav>
  </header>
  <main class="auth-wrap">
    <form class="auth-card" name="resetForm" novalidate ng-submit="vm.submit()">
      <auth-branding-header></auth-branding-header>
      <h2>Choose a new password</h2>
      <p class="sub">Reset links expire after 15 minutes and can only be used once.</p>
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" name="newPassword" ng-model="vm.password" autocomplete="new-password" required minlength="8" maxlength="128" ng-pattern="/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,128}/">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" ng-model="vm.confirmPassword" autocomplete="new-password" required>
      <p class="inline-error" ng-if="vm.error" role="alert">{{vm.error}}</p>
      <p class="inline-notice" ng-if="vm.notice" role="status">{{vm.notice}}</p>
      <button type="submit" class="btn-primary" ng-disabled="!vm.token">Reset password</button>
      <p class="switch-link"><a href="login.html">Return to login</a></p>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app.js?v=tcemate-ux-5"></script>
  <script src="js/data.js?v=tcemate-ux-5"></script>
  <script src="js/auth.js"></script>
</body>
</html>
